<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>World Cup 2026 Predictor</title>

<style>
body {
  margin: 0;
  background: linear-gradient(rgba(0,0,40,0.8), rgba(0,0,80,0.8)),
              url("https://images.unsplash.com/photo-1522778526097-ce0a22ceb253");
  background-size: cover;
  background-position: center;
  color: white;
  font-family: Arial;
  text-align: center;
  padding-top: 60px;
}

select, button {
  padding: 10px;
  font-size: 16px;
  margin: 10px;
  border-radius: 8px;
  border: none;
}

button {
  background: #00bfff;
  cursor: pointer;
}

#result {
  margin-top: 30px;
  font-size: 22px;
}
</style>
</head>

<body>

<h1>🏆 World Cup 2026 Predictor</h1>

<select id="team1">
  <option value="90">Франция</option>
  <option value="88">Бразилия</option>
  <option value="89">Аргентина</option>
  <option value="85">Англия</option>
  <option value="84">Испания</option>
  <option value="83">Португалия</option>
</select>

<select id="team2">
  <option value="90">Франция</option>
  <option value="88">Бразилия</option>
  <option value="89">Аргентина</option>
  <option value="85">Англия</option>
  <option value="84">Испания</option>
  <option value="83">Португалия</option>
</select>

<br>

<button onclick="predict()">Рассчитать прогноз</button>

<div id="result"></div>

<script>
function predict() {

  let team1 = document.getElementById("team1");
  let team2 = document.getElementById("team2");

  let power1 = parseInt(team1.value);
  let power2 = parseInt(team2.value);

  if (team1.selectedIndex === team2.selectedIndex) {
    document.getElementById("result").innerHTML = "❌ Выбери разные команды!";
    return;
  }

  let total = power1 + power2;
  let chance1 = Math.round((power1 / total) * 100);
  let chance2 = 100 - chance1;

  let score1 = Math.round((power1 / 30) * Math.random());
  let score2 = Math.round((power2 / 30) * Math.random());

  document.getElementById("result").innerHTML =
    "🔥 Вероятность победы: " +
    team1.options[team1.selectedIndex].text + " " + chance1 + "%<br>" +
    team2.options[team2.selectedIndex].text + " " + chance2 + "%<br><br>" +
    "⚽ Прогноз счёта: " + score1 + " - " + score2;
}
</script>

</body>
</html>
