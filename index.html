<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Футбольная викторина</title>

<style>
body {
  margin: 0;
  background: linear-gradient(rgba(0,0,40,0.8), rgba(0,0,80,0.8)),
              url("https://s-cdn.sportbox.ru/images/styles/upload/fp_fotos/c8/0b/5cf33ddce21daaafc7734492c4c771f05a07f371cd9fe267351822.jpg");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: white;
  text-align: center;
  font-family: Arial;
  padding-top: 60px;
}
button {
  display: block;
  margin: 10px auto;
  padding: 12px 20px;
  font-size: 18px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  width: 260px;
  background: #1e293b;
  color: white;
}

button:hover {
  background: #334155;
}

#result {
  margin-top: 20px;
  font-size: 22px;
}
</style>
</head>

<body>

<h1>⚽ Футбольная викторина</h1>

<h2 id="question"></h2>

<div id="answers"></div>

<div id="result"></div>

<script>
let questions = [
  {
    question: "Кто выиграл ЧМ-2018?",
    answers: ["Бразилия", "Германия", "Франция", "Аргентина"],
    correct: 2
  },
  {
    question: "Какой клуб выиграл ЛЧ 2022?",
    answers: ["Ман Сити", "Реал Мадрид", "Ливерпуль", "Бавария"],
    correct: 1
  },
  {
    question: "Сколько Золотых мячей у Месси?",
    answers: ["5", "6", "7", "8"],
    correct: 3
  },
  {
    question: "Кто лучший бомбардир в истории ЛЧ?",
    answers: ["Месси", "Роналду", "Левандовски", "Бензема"],
    correct: 1
  },
  {
    question: "Какая страна выиграла Евро-2016?",
    answers: ["Франция", "Германия", "Португалия", "Испания"],
    correct: 2
  }
];

let currentQuestion = 0;
let score = 0;

function loadQuestion() {
  let q = questions[currentQuestion];
  document.getElementById("question").innerText = q.question;

  let answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";

  q.answers.forEach((answer, index) => {
    let btn = document.createElement("button");
    btn.innerText = answer;
    btn.onclick = () => checkAnswer(index);
    answersDiv.appendChild(btn);
  });
}

function checkAnswer(index) {
  if (index === questions[currentQuestion].correct) {
    score++;
  }

  currentQuestion++;

  if (currentQuestion < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("question").innerText = "Игра окончена!";
  document.getElementById("answers").innerHTML = "";
  document.getElementById("result").innerHTML =
    "⚽ Твои очки: " + score + " из " + questions.length;
}

loadQuestion();
</script>

</body>
</html>
